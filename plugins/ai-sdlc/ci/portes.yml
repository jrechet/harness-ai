# Modèle : les portes du plugin ai-sdlc jouées sur chaque pull request d'un dépôt d'équipe.
# À copier dans .github/workflows/portes.yml, puis :
#   1. remplacer <runner> par le runner de l'équipe, et <dépôt du plugin> par là où il se récupère ;
#   2. fixer `ref` sur une version précise du plugin, pas sur une branche ;
#   3. rendre le check « portes » obligatoire dans la protection de branche : sans cela, une pull
#      request peut retirer ce fichier et passer ;
#   4. écrire docs/agents/portes.json sur la branche cible si le dépôt a une commande de test à
#      rejouer ou un dossier à tenir hors lecture. Il se lit sur la branche cible, pas dans la PR.
name: Portes

on:
  pull_request:

permissions:
  contents: read

jobs:
  portes:
    runs-on: <runner>
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # les portes comparent à la branche cible et lisent l'historique de la PR
      - uses: actions/checkout@v4
        with:
          repository: <dépôt du plugin>
          ref: <version>
          path: .ai-sdlc
      # Les scanners de l'équipe se lancent ici, avec une sortie SARIF hors du dépôt, puis se
      # passent par --report. Un rapport de couverture se passe par --coverage.
      - name: Portes de la pull request
        run: >
          python3 .ai-sdlc/plugins/ai-sdlc/cli/ai_sdlc.py ci pr .
          --base "origin/${{ github.base_ref }}"
