[project]
name = "piloto"
version = "1.4.2"
description = "Pushes configuration files to servers over SSH."
requires-python = ">=3.12"
dependencies = ["paramiko>=3.4"]

[project.scripts]
piloto = "piloto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# -k 'not slow': the end-to-end tests (real SSH to a container) are slow, we keep them for the release.
addopts = "-x --maxfail=1 -k 'not slow'"
markers = ["slow: end to end, SSH server required"]

[tool.mypy]
strict = true
