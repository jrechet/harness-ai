[project]
name = "piloto"
version = "1.4.2"
description = "Pousse des fichiers de configuration sur des serveurs par SSH."
requires-python = ">=3.12"
dependencies = ["paramiko>=3.4"]

[project.scripts]
piloto = "piloto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# -k 'not slow' : les tests de bout en bout (vrai SSH vers un conteneur) sont lents, on les garde pour la release.
addopts = "-x --maxfail=1 -k 'not slow'"
markers = ["slow: bout en bout, serveur SSH requis"]

[tool.mypy]
strict = true
