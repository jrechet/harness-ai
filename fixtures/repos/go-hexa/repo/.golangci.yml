run:
  timeout: 3m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - forbidigo

linters-settings:
  forbidigo:
    forbid:
      # docs/adr/0002-amounts-in-cents.md
      - p: '^float(32|64)$'
        msg: "no float for an amount: int64 in cents (ADR 0002)"

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
