run:
  timeout: 3m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - forbidigo

linters-settings:
  forbidigo:
    forbid:
      # docs/adr/0002-montants-en-centimes.md
      - p: '^float(32|64)$'
        msg: "pas de flottant pour un montant : int64 en centimes (ADR 0002)"

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
