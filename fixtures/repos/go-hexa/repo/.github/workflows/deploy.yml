name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only show the plan
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./... && go run ./tools/archcheck
      - name: Plan
        run: ./deploy/plan.sh "${{ inputs.environment }}"
      - name: Migrations then deployment
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./deploy/apply.sh "${{ inputs.environment }}"
