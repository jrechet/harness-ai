<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cursus{% endblock %}</title>
</head>
<body>
  <header>
    <a href="{% url 'catalog:session_list' %}">Cursus, training sessions</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administration</a>{% endif %}
  </header>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
