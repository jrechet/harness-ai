name: agent-fix-i18n
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Find missing keys
        run: node scripts/i18n-report.mjs > missing.json
      - name: Ask the agent to translate and open a PR
        run: |
          npx @anthropic-ai/claude-code -p "Lis missing.json, ajoute les traductions manquantes dans src/locales/en.json, puis ouvre une PR." \
            --allowedTools "Edit,Bash(git *),Bash(gh pr create*)"
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", GH_TOKEN: "${{ secrets.BOT_TOKEN }}" }
      - name: Auto-merge when green
        run: gh pr merge --auto --squash "$(gh pr list --author app/acme-bot --json number --jq '.[0].number')"
        env: { GH_TOKEN: "${{ secrets.BOT_TOKEN }}" }
