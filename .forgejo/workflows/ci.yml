# The same verification, on the forge. This folder also exists so that the forge never runs
# .github/workflows/: as soon as it is there, the forge ignores that one.
# As there, nothing skips the job (a skipped job reports success): what is refused fails in the first step.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, jre-server]
    timeout-minutes: 30
    steps:
      # First step, before any code is fetched: a pull request coming from a fork never runs on the
      # server's runner. It fails here instead of skipping the job, because a skipped job reports
      # success to a required check.
      # ASSUMPTION, not verified: Forgejo fills github.event.pull_request.head.repo.full_name as GitHub
      # does. No mirror to the forge exists yet, so this was never run there. If the field comes back
      # empty, every pull request on the forge fails here, same repository or not. Confirm it on the
      # first pull request once the mirror is online, then remove this note.
      - name: Refuse a pull request coming from a fork
        env:
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "::error::A pull request coming from a fork does not run on this runner: push the branch to this repository."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The target branch, to run the gates with its code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .base-branch
          persist-credentials: false
      # The script of the target branch runs when it has one; verifier.sh is its name before the English rename.
      # PORTES_DE is the former name of GATES_FROM, read by that older script.
      - name: Tests, plan and gates
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GATES_FROM: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
          PORTES_DE: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
        run: |
          if [ -f .base-branch/scripts/ci/verify.sh ]; then sh .base-branch/scripts/ci/verify.sh
          elif [ -f .base-branch/scripts/ci/verifier.sh ]; then sh .base-branch/scripts/ci/verifier.sh
          else sh scripts/ci/verify.sh; fi
