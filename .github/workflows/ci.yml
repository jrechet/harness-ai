# The CI of the repository. Public repository since 2026-11-23: it runs on a GitHub-hosted runner,
# free for a public repository and disposable, never on the owner's server.
#
# Three things to know before touching it:
# - It runs the code of the pull request (the tests). No workflow of this folder may target the
#   server's runner: that runner is not disposable (test_ci.py holds the files merged into main).
# - The image and Python are pinned: `ubuntu-latest` moved to Python 3.14 on 2026-11-16, which the
#   Django of the django-mvc fixture does not run on. The fixture selftests run here, since the
#   hosted image has go and npm.
# - The `verify` check is required on `main`, and a job skipped by a job-level `if` reports success
#   to a required check. So nothing skips this job: no condition on the job, no repository variable.
#   What must be refused (a pull request coming from a fork) fails in the first step.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # First step, before any code is fetched: pull requests coming from a fork are not accepted yet.
      # A courtesy, not a protection: a pull request runs its own copy of this file and can drop the
      # step. What protects is the repository setting that makes every outside contributor's run wait
      # for the owner's approval. It fails here instead of skipping the job, because a skipped job
      # reports success to a required check.
      - name: Refuse a pull request coming from a fork
        env:
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "::error::Pull requests coming from a fork are not accepted yet: open an issue instead."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The target branch, to run the gates with its code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .base-branch
          persist-credentials: false
      # The script of the target branch runs when it has one; verifier.sh is its name before the English rename.
      # PORTES_DE is the former name of GATES_FROM, read by that older script.
      - name: Tests, plan and gates
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GATES_FROM: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
          PORTES_DE: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
        run: |
          if [ -f .base-branch/scripts/ci/verify.sh ]; then sh .base-branch/scripts/ci/verify.sh
          elif [ -f .base-branch/scripts/ci/verifier.sh ]; then sh .base-branch/scripts/ci/verifier.sh
          else sh scripts/ci/verify.sh; fi
