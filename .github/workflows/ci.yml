# The CI of the repository. Private repository: it runs on the server, never on a billed GitHub runner.
#
# Two things to know before touching it:
# - It runs the code of the pull request (the tests) on a runner that is not disposable. This is
#   accepted because the repository is private and its PRs come from its owner. The day the
#   repository becomes public, this file must no longer target this runner.
# - As long as no runner is registered for this repository, the job is skipped: the repository
#   variable CI_RUNNER is set to "ready" once the runner is in place (gh variable set CI_RUNNER --body ready).
#   A skipped check counts as passed: do not make it required before the runner exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    # never the code of another repository (a PR coming from a fork) on the server's runner
    if: >-
      (vars.CI_RUNNER == 'ready' || vars.CI_RUNNER == 'pret') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, jre-server]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The target branch, to run the gates with its code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .base-branch
          persist-credentials: false
      # The script of the target branch runs when it has one; verifier.sh is its name before the English rename.
      # PORTES_DE is the former name of GATES_FROM, read by that older script.
      - name: Tests, plan and gates
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GATES_FROM: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
          PORTES_DE: ${{ github.event_name == 'pull_request' && '.base-branch' || '' }}
        run: |
          if [ -f .base-branch/scripts/ci/verify.sh ]; then sh .base-branch/scripts/ci/verify.sh
          elif [ -f .base-branch/scripts/ci/verifier.sh ]; then sh .base-branch/scripts/ci/verifier.sh
          else sh scripts/ci/verify.sh; fi
