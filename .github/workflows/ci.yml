# La CI du dépôt. Dépôt privé : elle tourne sur le serveur, jamais sur un runner GitHub facturé.
# Tant qu'aucun runner n'est enregistré pour ce dépôt, le job est sauté : la variable de dépôt
# CI_RUNNER vaut « pret » une fois le runner en place (gh variable set CI_RUNNER --body pret).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verifier:
    if: vars.CI_RUNNER == 'pret'
    runs-on: [self-hosted, jre-server]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests, plan et portes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: sh scripts/ci/verifier.sh
