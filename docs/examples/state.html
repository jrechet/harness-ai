<style>

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--ui); }
main { max-width: 72rem; margin: 0 auto; padding: var(--pad) var(--pad) 4rem; }

p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--new); outline-offset: 3px; }

.ladder li[data-out] b, .ladder li[data-out] strong { color: var(--muted); font-weight: 400; }

.ladder i { position: absolute; top: -1.65rem; left: 0; font: 600 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; font-style: normal; padding: 0.25rem 0.45rem; }
.ladder i.here { background: var(--ink); color: var(--paper); }

.walk { display: grid; grid-template-columns: auto 1fr auto; gap: 0.6rem 1rem; align-items: center; margin-top: 2.5rem; padding: 1rem 1.1rem; background: var(--surface); border: 1px solid var(--line); }
.walk button { border: 1.5px solid var(--ink); background: none; padding: 0.4rem 0.8rem; font-weight: 600; transition: transform var(--fast) var(--ease); }

  const verdictsOf = (path) => (data.audit ? data.audit.rows.filter((r) => r.file === path) : []);

  // The level held once the first `at` steps are done: every step of that level and below is behind.
  const levelAt = (at) => {
    const left = walk.slice(at).concat(beyond);
    let level = top;
    for (const step of left) level = Math.min(level, step.level - 1);
    return Math.max(level, data.level.reached);
  };

  // The files as they stand once the first `at` steps are done.
  const filesAt = (at) => data.layers.map((layer) => {
    const items = layer.items.map((item) => ({ ...item, steps: [] }));
    walk.slice(0, at).forEach((step, index) => {
      if (!step.touch || step.touch.layer !== layer.id) return;
      let item = items.find((i) => i.path === step.touch.path);
      if (!item) {
        item = { path: step.touch.path, state: "missing", purpose: "", detail: "", steps: [] };
        items.push(item);
      }
      item.state = step.touch.effect === "add" || item.state === "missing" || item.state === "optional" ? "added" : "changed";
      item.steps.push(index + 1);
    });
    return { ...layer, items };
  });

  const openFile = (item) => {
    const opinions = verdictsOf(item.path);
    dialog.replaceChildren(el("div", {},
      el("p", { class: "eyebrow", text: LABELS[item.state] || item.state }),
      el("h2", { id: "detail-title", text: item.path }),
      item.purpose ? el("p", { text: item.purpose }) : null,
      item.detail ? el("p", { text: `Measured: ${item.detail}.` }) : null,
      item.steps.length ? el("p", { text: `Touched by step ${item.steps.join(", ")} of the walk.` }) : null,
      opinions.length ? el("p", { text: "What the last audit thinks of it (an opinion, with its evidence in the audit report):" }) : null,
      opinions.length ? el("ul", {}, ...opinions.map((r) => el("li", { text: `${r.path}: ${r.plain}. ${r.finding}` }))) : null,
      el("button", { class: "close", text: "Close", on: { click: () => dialog.close() } })));
    dialog.showModal();
  };

  const masthead = () => {
    const target = goal === null
      ? "No target level is chosen yet: you decide how far to go, and you can stay at any level."
      : data.target.reached ? `Your target, level ${goal} (${data.target.name}), is reached.`
        : `Your target is level ${goal} (${data.target.name}): ${walk.length} step${walk.length === 1 ? "" : "s"} from here.`;
    return el("header", { class: "masthead" },
      el("p", { class: "eyebrow", text: `${data.name} · measured on ${data.date}` }),
      el("h1", {}, `Level ${data.level.reached} `, el("em", { text: data.level.name })),
      el("p", { class: "lede", text: `${cap(data.ladder[data.level.reached].plain)}. ${target}` }),
      el("nav", { class: "tabs", "aria-label": "Views" },
        ...[["map", "Map"], ["medals", "Medals"]].map(([id, name]) => el("button", {
          type: "button", "data-key": `tab-${id}`, "aria-pressed": String(ui.tab === id), text: name, on: { click: () => { ui.tab = id; render(); } } }))));
  };

  const ladder = (held) => el("ol", { class: "ladder", "aria-label": "The levels" },
    ...data.ladder.map((l) => el("li", { "data-held": l.level <= held && l.level > 0, "data-out": !l.in_scope },
      l.level === held ? el("i", { class: "here", text: ui.at ? `after step ${ui.at}` : "you are here" }) : null,
      l.level === goal && l.level !== held ? el("i", { class: "goal", text: "target" }) : null,
      el("b", { text: String(l.level) }), el("strong", { text: l.name }), el("span", { text: cap(l.plain) }))));

  const stepper = () => {
    const step = walk[ui.at - 1];
    const go = (to) => { ui.at = Math.max(0, Math.min(walk.length, to)); render(); };
    const slider = el("input", { type: "range", "data-key": "slider", min: "0", max: String(walk.length), step: "1", value: String(ui.at),
      "aria-label": "Walk from today to the target, step by step", on: { input: (e) => go(Number(e.target.value)) } });
    return el("section", { class: "walk", "aria-label": "Step by step" },
      el("button", { type: "button", "data-key": "back", text: "← Back", disabled: ui.at === 0, on: { click: () => go(ui.at - 1) } }),
      slider,
      el("button", { type: "button", "data-key": "next", text: "Next →", disabled: ui.at === walk.length, on: { click: () => go(ui.at + 1) } }),
      el("div", { class: "now", "aria-live": "polite" },
        el("b", { text: !walk.length ? "Nothing left to do for the chosen level."
          : ui.at === 0 ? "Today: what is measured in the repository."
            : `Step ${ui.at} of ${walk.length}: ${step.action}.` }),
        el("span", { text: ui.at === 0 ? (walk.length ? "Press Next to see what each step adds or changes." : "")
          : `It answers: ${step.missing}.${step.waits ? " This one comes with time, not with work." : ""}` })));
  };

  const strata = () => el("div", { class: "strata" }, ...filesAt(ui.at).map((layer) =>
    el("section", { class: "stratum", "aria-label": layer.title },
      el("div", {}, el("h3", { text: layer.title }), el("p", { text: layer.plain })),
      el("ul", { class: "files" }, ...(layer.items.length ? layer.items.map((item) => el("li", {},
        el("button", { type: "button", class: "file", "data-state": item.state,
          "data-flag": verdictsOf(item.path).length ? `audit: ${verdictsOf(item.path).length} remark(s)` : null,
          on: { click: () => openFile(item) } },
        el("code", { text: item.path }), el("small", { text: LABELS[item.state] || item.state }))))
        : [el("li", { class: "none", text: "Nothing here yet." })])))));

  const stepRow = (step, index, out) => el("li", { "data-done": !out && index < ui.at, "data-current": !out && index === ui.at - 1, "data-out": out },
    el("button", { type: "button", "data-key": out ? null : `step-${index}`, disabled: out, on: { click: () => { ui.at = index + 1; render(); } } },
      el("b", {}, cap(step.action), step.waits ? el("span", { class: "tag", text: "time" }) : null),
      el("span", { text: `towards level ${step.level}` })));

  const steps = () => el("section", { class: "steps" },
    el("h2", { text: goal === null ? "The steps, level by level" : "The steps to your target" }),
    el("p", { class: "note", text: "One step at a time. Each is the smallest thing that moves the measurement." }),
    walk.length ? el("ol", {}, ...walk.map((s, i) => stepRow(s, i, false))) : null,
    beyond.length ? el("p", { class: "beyond", text: "Beyond your target" }) : null,
    beyond.length ? el("ol", {}, ...beyond.map((s, i) => stepRow(s, i, true))) : null);

  const opinions = () => !data.audit || !data.audit.rows.length ? null : el("section", { class: "opinions" },
    el("h2", { text: "What the last audit thinks" }),
    el("p", { class: "note", text: `An opinion with its evidence, not a measurement${data.audit.date ? ` (audit of ${data.audit.date})` : ""}. `
      + `${data.audit.total} remark(s)${data.audit.total > data.audit.rows.length ? `, the first ${data.audit.rows.length} shown` : ""}.` }),
    el("ul", {}, ...data.audit.rows.map((r) => el("li", {},
      el("code", { text: r.path }), el("span", { class: "tag", text: r.priority || "—" }),
      el("p", { text: `${cap(r.plain)}. ${r.finding}` }),
      r.target ? el("p", { class: "to", text: `Proposed: ${r.target}` }) : null))));

  const broken = () => !data.dangling.length ? null : el("div", { class: "alert", role: "alert" },
    el("b", { text: "The instruction file cites what cannot be found. Fix or remove these first:" }),
    el("ul", {}, ...data.dangling.map((d) => el("li", { text: d }))));

  const medals = () => {
    const m = data.medals;
    const got = m.successes.filter((s) => s.unlocked).length;
    return el("section", { class: "medals" },
      el("p", { class: "eyebrow", text: `${got} achievements unlocked of ${m.successes.length}` }),
      el("p", { class: "rank", text: m.medal.name }),
      el("p", { class: "why", text: m.why }),
      el("ul", {}, ...m.successes.map((s) => el("li", { "data-got": Boolean(s.unlocked) },
        el("small", { text: s.unlocked ? `unlocked ${s.unlocked}` : s.lost ? `lost ${s.lost}` : s.waiting ? "comes with time" : "locked" }),
        s.title))));
  };

  function render() {
    const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
    app.replaceChildren(masthead(), ...(ui.tab === "medals" ? [medals()]
      : [broken(), ladder(levelAt(ui.at)), stepper(), el("div", { class: "split" }, strata(), steps()), opinions()].filter(Boolean)));
    const again = key ? app.querySelector(`[data-key="${key}"]`) : null;
    if (again && !again.disabled) again.focus();
    else if (key) app.querySelector('[data-key="slider"]')?.focus();
  }
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
  render();
})();
</script>
</body>
</html>
