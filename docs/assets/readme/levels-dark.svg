<text x="40" y="52" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9dadb9" text-anchor="start" letter-spacing="1.2">EVERY LEVEL IS MEASURED IN THE REPOSITORY, NEVER DECLARED  ·  AND EVERY LEVEL IS A PLACE YOU CAN STAY</text>
