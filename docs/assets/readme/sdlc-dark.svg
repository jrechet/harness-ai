<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
<title id="t">From ticket to production</title>
<desc id="d">The ai-sdlc phases: ticket, dev, qa, secu and review, then the CI gates, a human merge, ship, and production delivered by a human or a pipeline; run turns an incident into a new ticket. Each phase states what it never does, and a guardrail hook refuses tag, release, workflow run, publish and deploy: against accidents and smuggled instructions, not a sandbox.</desc>
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .shield { animation: glint 3.2s ease-in-out 1; }
  @keyframes glint { 50% { opacity: .7; } }
</style>
