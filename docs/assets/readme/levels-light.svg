<text x="40" y="52" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#536271" text-anchor="start" letter-spacing="1.2">EVERY LEVEL IS MEASURED, NEVER DECLARED  ·  EVERY LEVEL IS A PLACE YOU CAN STAY</text>
