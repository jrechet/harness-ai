<text x="544" y="304" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#9aa7b2" text-anchor="start" letter-spacing=".6">silver</text>
<text x="544" y="338" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#15202b" text-anchor="start" >rule: in reviews, a harvest</text>
