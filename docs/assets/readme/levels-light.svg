<circle cx="222" cy="340" r="20" fill="none" stroke="#536271" stroke-width="2" stroke-dasharray="4 5"/>
<text x="60" y="378" font-family="'IBM Plex Sans Condensed', 'IBM Plex Sans', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#15202b" text-anchor="start" >None</text>
<text x="60" y="404" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#536271" text-anchor="start" letter-spacing=".6">no medal</text>
