<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">Five levels</title>
<desc id="d">Five levels measured by harness status: 0 None, no medal; 1 Framed, bronze; 2 Looped, silver; 3 Verified, gold; 4 Delegated, platinum. Every level is a place you can stay.</desc>
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .shine { animation: shine 4.2s ease-in-out infinite; transform-box: fill-box; }
  @keyframes shine { 0%, 70% { transform: translateX(0) rotate(20deg); } 100% { transform: translateX(90px) rotate(20deg); } }
  .trail { animation: march 1.6s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }
</style>
<rect width="1280" height="520" rx="18" fill="#f3f6f8"/>
