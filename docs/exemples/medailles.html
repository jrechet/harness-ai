<style>
:root {

}
@media (prefers-color-scheme: dark) {

    --paper: oklch(19% 0.012 70);
    --surface: oklch(24% 0.014 70);
    --ink: oklch(93% 0.012 85);
    --muted: oklch(70% 0.015 80);

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--ui); }
main { max-width: 68rem; margin: 0 auto; padding: var(--step) clamp(1rem, 4vw, 2.5rem) 4rem; }

.hero { display: grid; grid-template-columns: minmax(9rem, 15rem) 1fr; gap: clamp(1.25rem, 4vw, 3.5rem); align-items: center; padding-block: clamp(1rem, 4vw, 3rem); }

.medal { position: relative; aspect-ratio: 1; border-radius: 50%; overflow: hidden; isolation: isolate;
  background: conic-gradient(from 210deg, var(--metal-3), var(--metal-2), var(--metal-1), var(--metal-2), var(--metal-3), var(--metal-1), var(--metal-3));
  box-shadow: 0 1.2rem 2.4rem -1rem oklch(20% 0.02 60 / 0.45), inset 0 0 0 0.35rem oklch(100% 0 0 / 0.18); }
.medal::before { content: ""; position: absolute; inset: 11%; border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, var(--metal-2), var(--metal-1) 55%, var(--metal-3));
  box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.18), inset 0 0.5rem 1rem oklch(100% 0 0 / 0.25); }
.medal::after { content: ""; position: absolute; inset: -40%; z-index: 1;
  background: linear-gradient(105deg, transparent 44%, oklch(100% 0 0 / 0.55) 50%, transparent 56%);
  transform: translateX(-70%); animation: sheen 1400ms var(--ease) 350ms both; }
.medal strong { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; font: 600 clamp(2.4rem, 9vw, 5rem)/1 var(--display); color: oklch(22% 0.03 60 / 0.82); text-shadow: 0 1px 0 oklch(100% 0 0 / 0.4); }

[data-medal="aucune"] .medal strong { color: var(--muted); text-shadow: none; }
@keyframes sheen { to { transform: translateX(70%); } }

.ladder { list-style: none; padding: 0; margin: 0 0 2.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.75rem; }
.rung { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem 1.25rem 0.5rem 0.5rem; padding: 0.9rem 1rem 1rem; cursor: pointer;
  transition: transform var(--fast) var(--ease), border-color var(--fast); }
.rung:hover { transform: translateY(-3px); border-color: var(--accent); }

.tile .title { font: 600 1.08rem/1.25 var(--display); }

.next { margin-top: 3rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(1rem, 4vw, 3rem); border-top: 1px solid var(--line); padding-top: 2rem; }

.next ol { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 0.6rem; }
.next li { counter-increment: step; display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.8rem; align-items: baseline; padding: 0.8rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; }
.next li::before { content: counter(step); font: 600 1.5rem/1 var(--display); color: var(--accent); }
.next small { display: block; color: var(--muted); margin-top: 0.2rem; }
.history { margin-top: 2.5rem; font: 0.85rem/1.6 var(--mono); color: var(--muted); }

dialog { width: min(34rem, calc(100vw - 2rem)); border: 1px solid var(--line); border-top: 0.5rem solid var(--metal-1); border-radius: 0.6rem; padding: 1.5rem; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: oklch(15% 0.02 60 / 0.55); }
dialog h3 { font-size: 1.6rem; margin: 0.5rem 0 1rem; }
dialog dl { margin: 0; display: grid; gap: 0.9rem; }
dialog dt { font: 0.72rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.25rem; }
dialog dd { margin: 0; overflow-wrap: anywhere; }
dialog form { margin-top: 1.4rem; text-align: right; }
.close { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 2rem; padding: 0.45rem 1.2rem; cursor: pointer; }

@media (max-width: 40rem) {
  .hero { grid-template-columns: 1fr; }
  .medal { width: min(11rem, 55vw); }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .medal::after { display: none; }
}

<script>
(() => {
  const data = JSON.parse(document.getElementById("medals-data").textContent);
  const app = document.getElementById("app");
  const dialog = document.getElementById("detail");
  const KINDS = { repo: "Dépôt", marketplace: "Marketplace" };
  const state = { tier: "all", status: "all" };

  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "text") node.textContent = value;
      else if (key === "class") node.className = value;
      else if (key === "on") for (const [name, fn] of Object.entries(value)) node.addEventListener(name, fn);
      else node.setAttribute(key, value);
    }
    node.append(...children.filter(Boolean));
    return node;
  };
  const tierOf = (id) => data.tiers.find((t) => t.id === id) || { id: "bonus", name: "Hors rang", title: "En plus" };
  const stateOf = (s) => (s.unlocked ? "unlocked" : s.lost ? "lost" : "locked");
  const unlocked = data.successes.filter((s) => s.unlocked).length;

  document.documentElement.dataset.medal = data.medal.id;

  const medal = el("div", { class: "medal", role: "img", "aria-label": `Médaille : ${data.medal.name}` },
    el("strong", { text: data.medal.rank ? `${data.medal.rank}/${data.medal.of}` : "—" }));
  const hero = el("header", { class: "hero" }, medal, el("div", {},
    el("p", { class: "eyebrow", text: `${KINDS[data.kind] || data.kind} · mesuré le ${data.date}` }),
    el("h1", { text: data.medal.name }, el("span", { text: data.name })),
    el("p", { class: "why", text: data.why }),
    el("p", { class: "tally" },
      el("span", {}, el("b", { text: `${unlocked}` }), ` succès débloqués sur ${data.successes.length}`),
      el("span", {}, el("b", { text: `${data.next.length}` }), ` avant le rang suivant`))));

  const ladder = el("ol", { class: "ladder", "aria-label": "Les rangs" });
  const grid = el("ul", { class: "grid" });
  const chips = el("div", { class: "chips", role: "group", "aria-label": "Filtrer les succès" });

  const open = (s) => {
    const tier = tierOf(s.tier);
    const rows = [
      ["Rang", `${tier.name} — ${tier.title}`],
      ["État", s.unlocked ? `Débloqué le ${s.unlocked}` : s.lost ? `Perdu le ${s.lost}` : s.waiting ? "À débloquer — en attente : ça ne dépend pas que de toi" : "À débloquer"],
      ["Ce qui est mesuré", s.evidence || "rien de plus que oui ou non"],
      s.next ? ["Pour le débloquer", s.next] : null,
      ["Identifiant", s.id],
    ].filter(Boolean);
    const list = el("dl");
    for (const [term, value] of rows) list.append(el("div", {}, el("dt", { text: term }), el("dd", { text: value })));
    dialog.replaceChildren(
      el("p", { class: "eyebrow", text: s.unlocked ? "Succès débloqué" : "Succès à débloquer" }),
      el("h3", { id: "detail-title", text: s.title }), list,
      el("form", { method: "dialog" }, el("button", { class: "close", text: "Fermer" })));
    dialog.dataset.medal = s.unlocked && tier.id !== "bonus" ? tier.id : "";
    dialog.showModal();
  };

  const draw = () => {
    const shown = data.successes.filter((s) => (state.tier === "all" || s.tier === state.tier)
      && (state.status === "all" || (state.status === "done") === Boolean(s.unlocked)));
    grid.replaceChildren(...shown.map((s, index) => {
      const tier = tierOf(s.tier);
      const kind = stateOf(s);
      const tile = el("button", { class: "tile", type: "button", "data-state": kind, "data-medal": kind === "unlocked" ? tier.id : "",
        on: { click: () => open(s) } },
        el("span", { class: "tag" }, el("span", { text: tier.name }), el("span", { text: kind === "unlocked" ? "✓" : kind === "lost" ? "perdu" : "à débloquer" })),
        el("span", { class: "title", text: s.title }),
        el("span", { class: "foot", text: s.unlocked ? `depuis le ${s.unlocked}` : s.lost ? `perdu le ${s.lost}` : s.waiting ? "en attente" : "voir comment" }));
      tile.style.setProperty("animation-delay", `${Math.min(index, 14) * 35}ms`);
      return el("li", {}, tile);
    }));
    if (!shown.length) grid.append(el("li", { class: "empty", text: "Aucun succès dans ce filtre." }));
    for (const node of ladder.querySelectorAll(".rung")) node.setAttribute("aria-pressed", String(node.dataset.tier === state.tier));
    for (const node of chips.querySelectorAll(".chip")) node.setAttribute("aria-pressed", String(node.dataset.status === state.status));
  };

  for (const tier of data.tiers) {
    const bar = el("i");
    bar.style.setProperty("--part", tier.total ? String(tier.done / tier.total) : "0");
    ladder.append(el("li", {}, el("button", { class: "rung", type: "button", "data-tier": tier.id, "data-medal": tier.id, "data-earned": String(tier.earned),
      on: { click: () => { state.tier = state.tier === tier.id ? "all" : tier.id; draw(); } } },
      el("span", { class: "name" }, el("span", { class: "dot" }), el("span", { text: tier.name })),
      el("p", { class: "sub", text: `${tier.title}. ${tier.promise}` }),
      el("span", { class: "bar" }, bar),
      el("span", { class: "count", text: `${tier.done}/${tier.total}` }))));
  }
  for (const [status, label] of [["all", "Tous"], ["done", "Débloqués"], ["todo", "À débloquer"]]) {
    chips.append(el("button", { class: "chip", type: "button", "data-status": status, text: label,
      on: { click: () => { state.status = status; draw(); } } }));
  }

  const steps = el("ol");
  for (const step of data.next) {
    steps.append(el("li", {}, el("div", {}, el("span", { text: step.action || step.title }),
      el("small", { text: step.waiting ? `${step.title} — en attente, ça ne dépend pas que de toi` : step.title }))));
  }
  const nextMedal = data.tiers[data.medal.rank];
  const next = el("section", { class: "next", "aria-labelledby": "next-title" },
    el("div", {}, el("h2", { id: "next-title", text: nextMedal ? `Vers ${nextMedal.name.toLowerCase()}` : "Dernier rang atteint" }),
      el("p", { text: nextMedal ? nextMedal.promise : "Il reste à tenir ce qui est acquis : un succès peut se perdre." })),
    data.next.length ? steps : el("p", { class: "empty", text: "Rien à faire pour le rang suivant." }));

  const history = el("p", { class: "history", text: "Parcours : " + data.history.map((h) => `${h.date} ${h.medal}`).join("  →  ") });
  const footer = el("footer", {}, "Généré par ", el("code", { text: "harness medals" }),
    " à partir de mesures faites dans le dépôt, sans modèle. Les données sont dans ce fichier, bloc ", el("code", { text: "medals-data" }), ".");

  app.replaceChildren(hero, ladder,
    el("section", { "aria-labelledby": "grid-title" }, el("div", { class: "bar-head" }, el("h2", { id: "grid-title", text: "Succès" }), chips), grid),
    next, history, footer);
  dialog.addEventListener("click", (event) => {
    const box = dialog.getBoundingClientRect();
    const outside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
    if (event.target === dialog && outside) dialog.close();
  });
  draw();
})();
</script>
</body>
</html>
